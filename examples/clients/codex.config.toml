# Cesteral MCP servers for Codex. Generated from registry.json; do not edit by hand.
# Copy the tables you need into ~/.codex/config.toml and export the variables each one lists.
# Credentials are read from your shell environment (env_vars), never stored here.

[mcp_servers.cesteral-dbm]
command = "npx"
args = ["-y", "@cesteral/dbm-mcp"]
env = { MCP_TRANSPORT_MODE = "stdio" }
env_vars = ["SERVICE_ACCOUNT_FILE"]

[mcp_servers.cesteral-dv360]
command = "npx"
args = ["-y", "@cesteral/dv360-mcp"]
env = { MCP_TRANSPORT_MODE = "stdio" }
env_vars = ["DV360_SERVICE_ACCOUNT_FILE"]

[mcp_servers.cesteral-ttd]
command = "npx"
args = ["-y", "@cesteral/ttd-mcp"]
env = { MCP_TRANSPORT_MODE = "stdio" }
env_vars = ["TTD_API_TOKEN"]

[mcp_servers.cesteral-gads]
command = "npx"
args = ["-y", "@cesteral/gads-mcp"]
env = { MCP_TRANSPORT_MODE = "stdio" }
env_vars = ["GADS_DEVELOPER_TOKEN", "GADS_CLIENT_ID", "GADS_CLIENT_SECRET", "GADS_REFRESH_TOKEN"]

