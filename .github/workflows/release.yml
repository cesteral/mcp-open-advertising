name: Release

# Two release lanes:
#
#   v1.2.3           → the full fleet (contract libs, shared, 13 servers, MCP Registry)
#   contract-v1.2.3  → ONLY @cesteral/contract-hash + @cesteral/contract-schema
#
# The second lane exists because `publish-all.sh` ships every package on one
# fleet tag, which made a contract-library fix un-releasable without a full
# fleet release (#94). That coupling is why the contract-hash `__proto__`
# security fix (#165) and the contract-schema annotation tightening (#171) both
# sat unpublished while the governance repo kept resolving the older, weaker
# published bytes under the same version number. These two packages are
# consumed directly by cesteral-intelligence and version-skew between the repos
# is a live correctness/security seam, so they get their own cadence.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "contract-v[0-9]+.[0-9]+.[0-9]+"

# id-token: npm provenance attestation + mcp-publisher GitHub OIDC login.
# contents: write: creating the GitHub Release.
permissions:
  contents: write
  id-token: write

# Serialize releases: a second tag pushed mid-release queues rather than
# racing the first. Never cancel an in-progress publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Fleet lane only. Both lanes share the `release` concurrency group above, so
    # a contract tag pushed mid-fleet-release queues rather than racing it.
    if: ${{ !startsWith(github.ref_name, 'contract-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Test repo scripts
        run: pnpm run test:scripts

      # Attestation review 2026-07-23, F7: the workspace contract-hash (which
      # generate-manifests.mjs hashes with) must canonicalize identically to the
      # PUBLISHED package of the same version (which the governance repo
      # exact-pins). An in-place canonicalization edit without a version bump
      # would otherwise ship manifests the downstream can never match —
      # silently de-attesting the fleet. Not-yet-published versions pass (this
      # release publishes them; governance bumps its pin in lockstep).
      - name: Contract-hash published parity
        run: node scripts/check-contract-hash-published-parity.mjs

      # Issue #171: the same seam on the other contract package. The release
      # gate (scripts/lib/manifest.mjs) validates with the WORKSPACE annotation
      # schema; governance admits with the PUBLISHED one. They are documented as
      # the same schema, and that claim is what makes "nothing that fails release
      # can reach `attested`" true. An in-place schema edit without a version
      # bump makes it false in the dangerous direction — a looser admission side.
      - name: Contract-schema published parity
        run: node scripts/check-contract-schema-published-parity.mjs

      - name: Install mcp-publisher
        run: |
          set -eo pipefail
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher && sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --help > /dev/null

      - name: Authenticate mcp-publisher (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish (npm with provenance + MCP Registry)
        run: ./scripts/publish-all.sh --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-contracts:
    # Contract-library lane: `contract-v*` tags publish ONLY the two leaf
    # libraries. No MCP Registry step — neither package is an MCP server.
    if: ${{ startsWith(github.ref_name, 'contract-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      # The full suite, not just the two packages: @cesteral/shared consumes both
      # libraries at runtime, so a canonicalization or schema change that breaks a
      # consumer must fail here rather than after the bytes are immutable on npm.
      - name: Test
        run: pnpm run test

      - name: Test repo scripts
        run: pnpm run test:scripts

      # Both parity guards run before publish, same as the fleet lane. A version
      # not yet on npm passes by design — this release is what publishes it.
      - name: Contract-hash published parity
        run: node scripts/check-contract-hash-published-parity.mjs

      - name: Contract-schema published parity
        run: node scripts/check-contract-schema-published-parity.mjs

      - name: Publish contract libraries (npm with provenance)
        run: ./scripts/publish-all.sh --provenance --contracts-only
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag --title "${{ github.ref_name }} (contract libraries)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
