name: Release

# Two release lanes:
#
#   v1.2.3           → the full fleet (contract libs, shared, 13 servers, MCP Registry)
#   contract-v1.2.3  → ONLY @cesteral/contract-hash + @cesteral/contract-schema
#
# The second lane exists because `publish-all.sh` ships every package on one
# fleet tag, which made a contract-library fix un-releasable without a full
# fleet release (#94). That coupling is why the contract-hash `__proto__`
# security fix (#165) and the contract-schema annotation tightening (#171) both
# sat unpublished while the governance repo kept resolving the older, weaker
# published bytes under the same version number. These two packages are
# consumed directly by cesteral-intelligence and version-skew between the repos
# is a live correctness/security seam, so they get their own cadence.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "contract-v[0-9]+.[0-9]+.[0-9]+"

# Read-only by default; each job asks for what it needs (#299).
#   id-token: write  - npm provenance attestation, and the mcp-publisher GitHub
#                      OIDC login. Only the two publish jobs have it.
#   contents: write  - creating the GitHub Release. Only the two small
#                      `github-release*` jobs have it, and they run no
#                      repository code and see no npm token.
permissions:
  contents: read

# Serialize releases: a second tag pushed mid-release queues rather than
# racing the first. Never cancel an in-progress publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Fleet lane only. Both lanes share the `release` concurrency group above, so
    # a contract tag pushed mid-fleet-release queues rather than racing it.
    if: ${{ !startsWith(github.ref_name, 'contract-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # #202: a stale load-bearing platform fact blocks a fleet release. The
      # fleet tag is a claim that these servers work against their platforms
      # today, and a fact past its `verifyBy` / `refreshDue` is not current.
      # Deliberately here and not on the PR path, where the calendar alone would
      # turn `main` red (see platform-facts.yml). Hermetic: plain node, no
      # install, so it runs first and fails in seconds. To release past it,
      # re-verify the fact, or mark it `superseded` / move its deadline in a
      # reviewed commit that says why. Being unable to check is not a reason.
      # Not in the contract lane: neither contract library relies on a platform fact.
      - name: Platform facts are current
        run: node scripts/check/check-platform-facts.mjs --freshness

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Test repo scripts
        run: pnpm run test:scripts

      # Attestation review 2026-07-23, F7: the workspace contract-hash (which
      # generate-manifests.mjs hashes with) must canonicalize identically to the
      # PUBLISHED package of the same version (which the governance repo
      # exact-pins). An in-place canonicalization edit without a version bump
      # would otherwise ship manifests the downstream can never match —
      # silently de-attesting the fleet. Not-yet-published versions pass (this
      # release publishes them; governance bumps its pin in lockstep).
      - name: Contract-hash published parity
        run: node scripts/check/check-contract-hash-published-parity.mjs

      # Issue #171: the same seam on the other contract package. The release
      # gate (scripts/lib/manifest.mjs) validates with the WORKSPACE annotation
      # schema; governance admits with the PUBLISHED one. They are documented as
      # the same schema, and that claim is what makes "nothing that fails release
      # can reach `attested`" true. An in-place schema edit without a version
      # bump makes it false in the dangerous direction — a looser admission side.
      - name: Contract-schema published parity
        run: node scripts/check/check-contract-schema-published-parity.mjs

      # npm first, and the only step that sees the npm token. `--npm-only` skips
      # the MCP Registry, which runs below with a downloaded binary and no token.
      - name: Publish to npm (with provenance)
        run: ./scripts/publish-all.sh --provenance --npm-only
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # #299: a fixed release, checked against the sha256 of the archive before
      # it is unpacked. It used to fetch whatever release was newest and pipe it
      # straight into tar.
      # The hash is the linux_amd64 line of the release's own
      # `registry_<version>_checksums.txt`. Bump both values together, in a
      # reviewed PR, after reading the release notes.
      - name: Install mcp-publisher (pinned, checksum-verified)
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
          sudo install -m 0755 "$RUNNER_TEMP/mcp-publisher" /usr/local/bin/mcp-publisher
          mcp-publisher --help > /dev/null

      - name: Authenticate mcp-publisher (GitHub OIDC)
        run: mcp-publisher login github-oidc

      # No NODE_AUTH_TOKEN here: the downloaded binary never runs with the npm token.
      - name: Publish to the MCP Registry
        run: ./scripts/publish-all.sh --registry-only

  github-release:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No checkout: `gh` is pointed at the repository explicitly, so no
      # repository code runs in the one job that can write to it.
      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  release-contracts:
    # Contract-library lane: `contract-v*` tags publish ONLY the two leaf
    # libraries. No MCP Registry step — neither package is an MCP server.
    if: ${{ startsWith(github.ref_name, 'contract-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      # The full suite, not just the two packages: @cesteral/shared consumes both
      # libraries at runtime, so a canonicalization or schema change that breaks a
      # consumer must fail here rather than after the bytes are immutable on npm.
      - name: Test
        run: pnpm run test

      - name: Test repo scripts
        run: pnpm run test:scripts

      # Both parity guards run before publish, same as the fleet lane. A version
      # not yet on npm passes by design — this release is what publishes it.
      - name: Contract-hash published parity
        run: node scripts/check/check-contract-hash-published-parity.mjs

      - name: Contract-schema published parity
        run: node scripts/check/check-contract-schema-published-parity.mjs

      - name: Publish contract libraries (npm with provenance)
        run: ./scripts/publish-all.sh --provenance --contracts-only
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release-contracts:
    needs: release-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag --title "${{ github.ref_name }} (contract libraries)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
