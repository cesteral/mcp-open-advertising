# Cross-server routing evals — does a model pick the right platform's tool out of
# the merged tools/list? (#205 Part 2)
#
# Why this is MANUAL and not scheduled:
#
#   The PR path already runs everything that can be proved for free — the merged
#   catalog's structural invariants, the corpus, the scoring rules, the model
#   router's request/response handling through an injected fetch, and the
#   deterministic control router end-to-end, compared against its recorded
#   baseline. See evals/cross-server-routing.test.mjs.
#
#   What is left needs real model calls against a ~125k-token tool catalog, which
#   costs money every run. It is also not a property of the commit under review:
#   the same diff can score differently twice.
#
#   It used to run weekly. That was removed deliberately: the input only changes
#   when tool names, titles or descriptions change, so a schedule mostly bills for
#   re-measuring an unchanged catalog — and with no credential configured it would
#   just file the same "could not be measured" issue every week. The model half is
#   now run BY HAND when tool text changes:
#
#     ant auth login
#     unset ANTHROPIC_API_KEY
#     set -a; eval "$(ant auth print-credentials --env)"; set +a
#     pnpm eval:routing:model
#
#   then record the numbers in evals/cross-server-routing.baseline.json.
#
#   This workflow is kept for the manual path — if an ANTHROPIC_API_KEY secret is
#   ever added, `workflow_dispatch` runs the same thing on a runner. It costs
#   nothing sitting here, and restoring the schedule is re-adding the `schedule:`
#   key below.

name: Cross-server routing evals

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to evaluate"
        required: false
        default: "claude-sonnet-5"

concurrency:
  group: routing-evals
  cancel-in-progress: false

# contents: read — checkout only; this workflow never pushes.
# issues: write  — create, update, comment on and close the tracking issue.
permissions:
  contents: read
  issues: write

jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The eval boots each server from its dist output, so a build is required
      # before the catalog can be assembled at all.
      - run: pnpm run build

      # The control first: free, deterministic, and the floor every model number
      # is read against. A regression here is a real finding on its own — it
      # means a description edit made cross-server confusion measurably worse.
      - name: Deterministic control
        run: node evals/run-cross-server-routing.mjs --router=lexical --out="$RUNNER_TEMP/lexical.json"

      # The subject. `continue-on-error` because the exit code is the payload:
      # 1 (regressed) and 2 (could not run — no key) are both reported through
      # the tracking issue rather than as a bare red X, so the reason survives
      # past log retention.
      - name: Model router
        id: model
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          node evals/run-cross-server-routing.mjs \
            --router=anthropic \
            --model="${{ inputs.model || 'claude-sonnet-5' }}" \
            --out="$RUNNER_TEMP/model.json" 2>&1 | tee "$RUNNER_TEMP/model.txt"
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-eval-reports
          path: |
            ${{ runner.temp }}/lexical.json
            ${{ runner.temp }}/model.json
          if-no-files-found: warn

      - name: Sync tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.model.outputs.exit_code }}
        run: |
          set -euo pipefail
          body="$(cat "$RUNNER_TEMP/model.txt" 2>/dev/null || echo '(no output captured)')"

          gh label create routing-evals --color 1D76DB \
            --description "Cross-server tool routing regressed or could not be measured" 2>/dev/null || true

          existing="$(gh issue list --state open --label routing-evals --limit 100 \
            --json number --jq '.[0].number // empty')"

          # A clean run CLOSES the issue. A stale alert left open makes the next
          # real one read as already-known.
          if [ "$EXIT_CODE" = "0" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body \
                "Cross-server routing is at or above baseline as of $(date -u +%Y-%m-%d). Closing."
              gh issue close "$existing"
            fi
            exit 0
          fi

          title="Cross-server routing regressed"
          [ "$EXIT_CODE" = "2" ] && title="Cross-server routing could not be measured"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$(printf '### %s — %s\n\n```\n%s\n```\n' \
              "$title" "$(date -u +%Y-%m-%d)" "$body")"
          else
            gh issue create --label routing-evals --title "$title" \
              --body "$(printf '%s\n\n```\n%s\n```\n\nThe report artifact on this run has the per-case verdicts. `wrong-platform` and `wrong-operation` need different fixes: the first is cross-server confusion (tool descriptions that do not identify their platform), the second is a per-server ranking problem belonging in `evals/tool-search-ranking.json`.\n\nIf this is the FIRST model run, there is no baseline yet — read the failures, then record the numbers in `evals/cross-server-routing.baseline.json` with the real run date. Never record a baseline from a run whose failures nobody has read.\n' \
                "$title" "$body")"
          fi

          exit 1
