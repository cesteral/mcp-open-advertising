name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Read-only by default: no job here writes to the repository, so the token must
# not depend on a repository setting for that to hold.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job layout. `build` produces every package's dist/ once and publishes it as
# the `build-output` artifact; the jobs that need built packages download it
# instead of rebuilding, and run in parallel.
#
#   checks          source-only checks, no build needed; runs beside `build`
#   build           pnpm run build, then upload packages/*/dist
#   lint            type-aware, so it reads the built declarations
#   typecheck       turbo's `typecheck` and `test` depend on `^build`; `--only`
#   test-packages   skips those, because the artifact already holds the builds
#   test-scripts    the root scripts suite (vitest.config.scripts.ts)
#   attestation     manifests + the registry/runtime check boot every server
#   conformance     the MCP conformance harness against each server
#
# `pnpm ci:local` runs these same steps one job after another (scripts/ci-local.mjs).
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Check registry → server.json (per-package manifest matches registry.json)
        run: pnpm run check:registry

      - name: Check registry → tools list (registry tools match source definitions)
        run: pnpm run check:registry-tools

      - name: Check client configs (generated Claude Code and Codex configs match registry.json)
        run: pnpm run check:client-configs

      - name: Check registry → docs (README + CLAUDE.md tool counts match registry.json)
        run: pnpm run check:doc-tool-counts

      - name: Check account-scope coverage (session-bound tools assert caller-supplied scope)
        run: pnpm run check:account-scope

      # HERMETIC half of #202 only: ledger shape, plus every codeRef still
      # containing the value the ledger claims for it. The time-dependent
      # freshness half runs on a schedule (platform-facts.yml) so the calendar
      # cannot turn `main` red on a commit that changed nothing.
      - name: Check platform-facts ledger matches the code it describes
        run: pnpm run check:platform-facts

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Everything `pnpm run build` produces is under packages/*/dist (see
      # turbo.json `outputs`). Downloaded into packages/, it puts each dist/
      # back where the workspace links resolve it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output
          path: packages/*/dist
          if-no-files-found: error
          retention-days: 1

  lint:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: packages

      # Type-aware: the config sets parserOptions.project, so workspace imports
      # must resolve to the built declarations restored above.
      - name: Lint
        run: pnpm run lint

  typecheck:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: packages

      - name: Typecheck
        run: pnpm exec turbo run typecheck --only

  test-packages:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: packages

      - name: Test
        run: pnpm exec turbo run test --only

  test-scripts:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: packages

      - name: Test repo scripts
        run: pnpm run test:scripts

  attestation:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: packages

      - name: Generate + validate attestation manifests
        run: pnpm run generate:manifests

      - name: Check registry → live MCP advertisement (tools/list + prompts/list match registry)
        run: pnpm run check:registry-runtime

  conformance:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: packages

      - name: Run conformance tests
        run: pnpm run test:conformance:ci

  # Generates a throwaway server with `pnpm new:server` in a git worktree and
  # proves it passes the fleet checks: the read-only scaffold with no failure
  # at all, and the promotion journey with only its write stubs' wire-request
  # coverage failing (scripts/scaffold/expected-todo.mjs). A change to the
  # template or to any fleet check that a new server would trip fails here.
  scaffold-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # read-only: the default scaffold must pass everything. journey: it then
        # gains write stubs and is promoted; only their wire coverage may fail.
        # staged: read-only checks, then write stubs, then the checks again.
        include:
          - { type: management, variant: read-only }
          - { type: management, variant: journey }
          - { type: reporting, variant: staged }
          - { type: reporting_conversions, variant: read-only }
          - { type: reporting_conversions, variant: journey }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scaffold a server and run the fleet checks on it
        run: node scripts/scaffold/smoke.mjs --type ${{ matrix.type }} --variant ${{ matrix.variant }}

  terraform-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9"

      # -lockfile=readonly so CI cannot silently repair an incomplete lock file
      # in its ephemeral checkout and still report green. That is exactly what
      # happened with the lock committed in #187: it carried a single darwin_arm64
      # `h1:` hash, this job quietly added the linux_amd64 one and passed, and the
      # gap only surfaced when the scheduled drift workflow — which already used
      # the stricter flag — failed on the runner.
      #
      # Note where the failure actually lands. `init` still SUCCEEDS with an
      # incomplete lock: it verifies the downloaded zip against the platform-
      # agnostic `zh:` hashes and merely declines to record the new `h1:`. The
      # next command to load the extracted plugin — `terraform validate` below —
      # is what fails, with:
      #
      #   the cached package for registry.terraform.io/hashicorp/google <ver>
      #   (in .terraform/providers) does not match any of the checksums recorded
      #   in the dependency lock file
      #
      # If you see that, the lock is missing checksums for a platform rather than
      # anything being wrong with this runner. Fix it at the source; do not drop
      # the flag:
      #   terraform providers lock \
      #     -platform=linux_amd64 -platform=linux_arm64 \
      #     -platform=darwin_amd64 -platform=darwin_arm64
      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false -lockfile=readonly -input=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gacts/gitleaks@4fd785dcdaf557fda64e05b0ae033b8f7d82fb81 # v1.3.3

  # Issues #165/#171: a contract library's source must not change without a
  # version bump. npm versions are immutable, so an unbumped edit leaves the
  # published package the governance repo exact-pins unable to ever contain the
  # change. This has happened at least four times.
  #
  # Its own job, not a build-and-test step, for two reasons: it needs history
  # (`fetch-depth: 0`) to find the merge base, and it needs neither a pnpm
  # install nor a build, so it reports in seconds instead of waiting behind the
  # full suite.
  contract-version-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # Invoked directly rather than via `pnpm run` so this job needs no pnpm
      # setup and no dependency install — the script is plain node + git.
      - name: Check contract libraries bump their version when src changes
        run: node scripts/check/check-contract-version-bump.mjs
