name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Check registry → server.json (per-package manifest matches registry.json)
        run: pnpm run check:registry

      - name: Check registry → tools list (registry tools match source definitions)
        run: pnpm run check:registry-tools

      - name: Check registry → docs (README + CLAUDE.md tool counts match registry.json)
        run: pnpm run check:doc-tool-counts

      - name: Check account-scope coverage (session-bound tools assert caller-supplied scope)
        run: pnpm run check:account-scope

      - name: Build
        run: pnpm run build

      - name: Test repo scripts
        run: pnpm run test:scripts

      - name: Generate + validate attestation manifests
        run: pnpm run generate:manifests

      - name: Check registry → live MCP advertisement (tools/list + prompts/list match registry)
        run: pnpm run check:registry-runtime

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  conformance:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run conformance tests
        run: pnpm run test:conformance:ci

  terraform-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      # -lockfile=readonly so CI cannot silently repair an incomplete lock file
      # in its ephemeral checkout and still report green. That is exactly what
      # happened with the lock committed in #187: it carried a single darwin_arm64
      # `h1:` hash, this job quietly added the linux_amd64 one and passed, and the
      # gap only surfaced when the scheduled drift workflow — which already used
      # the stricter flag — failed on the runner.
      #
      # Note where the failure actually lands. `init` still SUCCEEDS with an
      # incomplete lock: it verifies the downloaded zip against the platform-
      # agnostic `zh:` hashes and merely declines to record the new `h1:`. The
      # next command to load the extracted plugin — `terraform validate` below —
      # is what fails, with:
      #
      #   the cached package for registry.terraform.io/hashicorp/google <ver>
      #   (in .terraform/providers) does not match any of the checksums recorded
      #   in the dependency lock file
      #
      # If you see that, the lock is missing checksums for a platform rather than
      # anything being wrong with this runner. Fix it at the source; do not drop
      # the flag:
      #   terraform providers lock \
      #     -platform=linux_amd64 -platform=linux_arm64 \
      #     -platform=darwin_amd64 -platform=darwin_arm64
      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false -lockfile=readonly -input=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gacts/gitleaks@v1

  # Issues #165/#171: a contract library's source must not change without a
  # version bump. npm versions are immutable, so an unbumped edit leaves the
  # published package the governance repo exact-pins unable to ever contain the
  # change. This has happened at least four times.
  #
  # Its own job, not a build-and-test step, for two reasons: it needs history
  # (`fetch-depth: 0`) to find the merge base, and it needs neither a pnpm
  # install nor a build, so it reports in seconds instead of waiting behind the
  # full suite.
  contract-version-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Invoked directly rather than via `pnpm run` so this job needs no pnpm
      # setup and no dependency install — the script is plain node + git.
      - name: Check contract libraries bump their version when src changes
        run: node scripts/check-contract-version-bump.mjs
