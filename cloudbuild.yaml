# Cloud Build configuration for Cesteral MCP Servers
# Pipeline: test -> build -> scan -> push, then (only with _DEPLOY=true)
# terraform plan -> apply -> health checks.

substitutions:
  _ENVIRONMENT: 'dev'
  _REGION: 'europe-west2'
  _ARTIFACT_REGISTRY_REPO: 'cesteral'
  # Build-only by default: deploys run from scripts/deploy.sh under a person's
  # credentials. Setting this to 'true' needs a build service account that can
  # plan and apply this stack, including project IAM bindings, which is
  # effectively Owner. The default compute service account has only
  # roles/cloudbuild.builds.builder. Validate and tflint still run, against
  # `terraform init -backend=false`, so a build-only run needs no gitignored
  # backend config or tfvars.
  _DEPLOY: 'false'
  # Safety interlock: prod infrastructure is never mutated by an automated build
  # unless this is explicitly set to 'true' (intended to be paired with a
  # trigger-level approval gate). Non-prod environments apply automatically
  # when _DEPLOY is 'true'.
  _CONFIRM_PROD_APPLY: 'false'

options:
  substitution_option: 'ALLOW_LOOSE'
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'node:26-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Without -e only the last command's status counted, so a failing
        # check, build or typecheck passed the step if the tests did.
        set -eu
        # The fleet's service list, from registry.json, for the later steps
        # (their images have no node).
        node scripts/fleet.mjs servers > /workspace/.fleet-services
        npm install -g pnpm@10.34.5
        pnpm install --frozen-lockfile
        pnpm run check:registry
        pnpm run check:registry-tools
        pnpm run build
        pnpm run typecheck
        # Turbo runs 10 package tasks at once by default, each with its own
        # vitest workers, which ran 8 GB out of memory (exit 137). Two at a
        # time is all the default pool's 2 vCPUs can use anyway.
        pnpm run test --concurrency=2
    id: 'test'

  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -eu
        SERVICES="$$(cat /workspace/.fleet-services)"
        [ -n "$$SERVICES" ] || { echo "empty /workspace/.fleet-services" >&2; exit 1; }
        # One at a time: the Dockerfile's dependency and monorepo-build layers
        # do not depend on SERVER_NAME, so the first image builds them and the
        # rest reuse the cache and only run `pnpm deploy`. In parallel, every
        # build misses the cache and compiles the monorepo at the same time,
        # which is what needed an 8-vCPU machine. Serial also lets `set -e`
        # see a failure; a bare `wait` exits 0 whatever its jobs returned.
        for SERVICE in $$SERVICES; do
          docker build \
            -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/$${SERVICE}:${SHORT_SHA}" \
            -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/$${SERVICE}:${_ENVIRONMENT}-latest" \
            --build-arg "SERVER_NAME=$${SERVICE}" \
            -f Dockerfile .
        done
    id: 'build-images'
    waitFor: ['test']

  - name: 'aquasec/trivy:0.55.2'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -eu
        SERVICES="$$(cat /workspace/.fleet-services)"
        [ -n "$$SERVICES" ] || { echo "empty /workspace/.fleet-services" >&2; exit 1; }
        # Serial, so `--exit-code 1` fails the step. Run in the background
        # behind a bare `wait`, a HIGH/CRITICAL finding never blocked anything.
        for SERVICE in $$SERVICES; do
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            --ignore-unfixed \
            "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/$${SERVICE}:${SHORT_SHA}"
        done
    id: 'vulnerability-scan'
    waitFor: ['build-images']

  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -eu
        SERVICES="$$(cat /workspace/.fleet-services)"
        [ -n "$$SERVICES" ] || { echo "empty /workspace/.fleet-services" >&2; exit 1; }
        # Pushes are network-bound, so they stay parallel, but each job is
        # waited on by PID: a bare `wait` exits 0 even when a push failed.
        PIDS=""
        for SERVICE in $$SERVICES; do
          docker push --all-tags "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/$${SERVICE}" &
          PIDS="$$PIDS $$!"
        done
        for PID in $$PIDS; do
          wait "$$PID"
        done
        # Resolve the immutable registry digest for each pushed image and persist
        # it to /workspace so the Terraform step can deploy by digest rather than
        # the mutable :SHORT_SHA tag (audit + reliable rollback).
        mkdir -p /workspace/digests
        for SERVICE in $$SERVICES; do
          IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/$${SERVICE}"
          DIGEST=$$(docker inspect --format='{{index .RepoDigests 0}}' "$${IMAGE}:${SHORT_SHA}" | sed 's/^.*@//')
          if [ -z "$$DIGEST" ]; then
            echo "Failed to resolve digest for $${IMAGE}:${SHORT_SHA}" >&2
            exit 1
          fi
          echo "$$DIGEST" > "/workspace/digests/$${SERVICE}"
        done
    id: 'push-images'
    waitFor: ['vulnerability-scan']

  - name: 'hashicorp/terraform:1.9'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -eu
        cd terraform
        if [ "${_DEPLOY}" = "true" ]; then
          terraform init -backend-config=backend-${_ENVIRONMENT}.conf -reconfigure
        else
          # validate and tflint need providers and modules, not state, so a
          # build-only run needs no backend config (it is gitignored).
          terraform init -backend=false
        fi
    id: 'terraform-init'
    waitFor: ['push-images']

  - name: 'hashicorp/terraform:1.9'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd terraform
        terraform validate
    id: 'terraform-validate'
    waitFor: ['terraform-init']

  - name: 'ghcr.io/terraform-linters/tflint:v0.53.0'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd terraform
        tflint --init
        tflint --recursive --minimum-failure-severity=error
    id: 'tflint'
    waitFor: ['terraform-init']

  - name: 'hashicorp/terraform:1.9'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ "${_DEPLOY}" != "true" ]; then
          echo "Skipping terraform plan: _DEPLOY is not 'true' (build-only)."
          exit 0
        fi
        cd terraform
        # Deploy by immutable digest (resolved in push-images) rather than the
        # mutable :SHORT_SHA tag. Write the mcp_images map (keyed by package)
        # from /workspace/digests as a var file, passed AFTER the tfvars:
        # Terraform applies -var and -var-file in command-line order, the last
        # value wins, and a map is replaced, not merged. The environment
        # tfvars sets mcp_images (placeholders for hand runs and the drift
        # check), so passed first, those placeholders replaced every digest.
        # Same order as scripts/deploy.sh.
        IMAGES=/workspace/mcp-images.tfvars.json
        SEP=""
        printf '{"mcp_images":{' > "$$IMAGES"
        for SERVICE in $$(cat /workspace/.fleet-services); do
          DIGEST=$$(cat "/workspace/digests/$${SERVICE}")
          printf '%s"%s":"%s"' "$$SEP" "$$SERVICE" "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/$${SERVICE}@$${DIGEST}" >> "$$IMAGES"
          SEP=","
        done
        printf '}}\n' >> "$$IMAGES"
        terraform plan -var-file=${_ENVIRONMENT}.tfvars -var-file="$$IMAGES" -out=tfplan > /workspace/plan.log 2>&1 || { cat /workspace/plan.log; exit 1; }
        cat /workspace/plan.log
        # Terraform only warns when a tfvars file sets an undeclared variable,
        # so a renamed variable would otherwise fall back to its default.
        if grep -q 'undeclared variable' /workspace/plan.log; then
          echo "${_ENVIRONMENT}.tfvars sets variables Terraform does not declare (see the warning above)." >&2
          exit 1
        fi
    id: 'terraform-plan'
    waitFor: ['terraform-validate', 'tflint']

  # Saves the plan for review. A step rather than an `artifacts:` block,
  # because a build with an artifact path that matches no file fails, and a
  # build-only run writes no plan.
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ "${_DEPLOY}" != "true" ]; then
          echo "Skipping plan upload: _DEPLOY is not 'true' (build-only)."
          exit 0
        fi
        gcloud storage cp terraform/tfplan "gs://${PROJECT_ID}-build-artifacts/${_ENVIRONMENT}/${BUILD_ID}/tfplan"
    id: 'upload-plan'
    waitFor: ['terraform-plan']

  # Production must not be mutated by the automated pipeline without a human in
  # the loop. This step stops after the reviewed plan (uploaded as a build
  # artifact) unless _CONFIRM_PROD_APPLY=true — promote prod via a separate
  # approval-gated trigger that sets it. Pair with the trigger-level approval
  # config for defense in depth.
  # See: https://cloud.google.com/build/docs/securing-builds/gate-builds-on-approval
  - name: 'hashicorp/terraform:1.9'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ "${_DEPLOY}" != "true" ]; then
          echo "Skipping terraform apply: _DEPLOY is not 'true' (build-only)."
          exit 0
        fi
        cd terraform
        if [ "${_ENVIRONMENT}" = "prod" ] && [ "${_CONFIRM_PROD_APPLY}" != "true" ]; then
          echo "Skipping terraform apply for prod: _CONFIRM_PROD_APPLY is not 'true'."
          echo "The reviewed plan is saved to the build artifacts bucket."
          echo "Promote it via the approval-gated prod apply trigger."
          exit 0
        fi
        terraform apply -auto-approve tfplan
    id: 'terraform-apply'
    waitFor: ['upload-plan']

  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ "${_DEPLOY}" != "true" ]; then
          echo "Skipping health checks: _DEPLOY is not 'true' (build-only)."
          exit 0
        fi
        FAILED_SERVICES=""
        SERVICES="$$(cat /workspace/.fleet-services)"
        [ -n "$$SERVICES" ] || { echo "empty /workspace/.fleet-services" >&2; exit 1; }
        for SERVICE in $$SERVICES; do
          HEALTHY=false
          URL=$$(gcloud run services describe "$$SERVICE" \
            --region="${_REGION}" \
            --format='value(status.url)' 2>/dev/null || echo "")
          if [ -z "$$URL" ]; then
            echo "WARNING: Service $$SERVICE not found, skipping"
            continue
          fi
          for i in $$(seq 1 24); do
            if curl -s -o /dev/null -w "%{http_code}" "$$URL/health" | grep -q "200"; then
              HEALTHY=true
              break
            fi
            sleep 5
          done
          if [ "$$HEALTHY" != "true" ]; then
            FAILED_SERVICES="$$FAILED_SERVICES $$SERVICE"
            PREV_REVISION=$$(gcloud run revisions list \
              --service="$$SERVICE" \
              --region="${_REGION}" \
              --sort-by='~creationTimestamp' \
              --format='value(metadata.name)' \
              --limit=2 | tail -n1)
            if [ -n "$$PREV_REVISION" ]; then
              gcloud run services update-traffic "$$SERVICE" \
                --region="${_REGION}" \
                --to-revisions="$${PREV_REVISION}=100"
            fi
          fi
        done
        if [ -n "$$FAILED_SERVICES" ]; then
          echo "DEPLOYMENT FAILED — rolled back:$$FAILED_SERVICES"
          exit 1
        fi
    id: 'health-check'
    waitFor: ['terraform-apply']

# Static: Cloud Build's images: field cannot read registry.json, so this list
# is hand-maintained. scripts/lib/fleet-inventory.test.mjs fails if it drifts
# from the registry.
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/dbm-mcp:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/dbm-mcp:${_ENVIRONMENT}-latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/dv360-mcp:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/dv360-mcp:${_ENVIRONMENT}-latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/ttd-mcp:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/ttd-mcp:${_ENVIRONMENT}-latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/gads-mcp:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/gads-mcp:${_ENVIRONMENT}-latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/meta-mcp:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/meta-mcp:${_ENVIRONMENT}-latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/linkedin-mcp:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/linkedin-mcp:${_ENVIRONMENT}-latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/tiktok-mcp:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/tiktok-mcp:${_ENVIRONMENT}-latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/cm360-mcp:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/cm360-mcp:${_ENVIRONMENT}-latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/sa360-mcp:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/sa360-mcp:${_ENVIRONMENT}-latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/pinterest-mcp:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/pinterest-mcp:${_ENVIRONMENT}-latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/snapchat-mcp:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/snapchat-mcp:${_ENVIRONMENT}-latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/amazon-dsp-mcp:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/amazon-dsp-mcp:${_ENVIRONMENT}-latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/msads-mcp:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/msads-mcp:${_ENVIRONMENT}-latest'


# Sized for the default pool's 2 vCPUs: the first full run took 58m 42s
# (build 910c1d51: test 21m, 13 images 29m, scan 6m). Billed per minute used,
# so headroom costs nothing unless a build actually needs it.
timeout: '5400s'
